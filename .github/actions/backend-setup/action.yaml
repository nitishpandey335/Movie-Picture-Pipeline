name: Backend setup
description: Checkout, install Python, restore pipenv cache, and install backend dependencies

runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Restore pip cache
      uses: actions/cache@v4
      with:
        # Cache pip's download cache, not the materialized virtualenv: the venv's
        # bin/python symlink points at this job's ephemeral toolcache path and goes
        # dangling when restored on a different runner, so the venv must always be
        # created fresh while only the downloaded wheels are reused.
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('starter/backend/Pipfile.lock') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      shell: bash
      working-directory: starter/backend
      run: |
        pip install pipenv
        pipenv install --dev --deploy
